name: Node.js CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Docker Image
        run: docker build -t node-app .

      - name: Run Docker Container
        run: |
          docker run -d -p 8080:8080 --name node-app-container node-app
          sleep 5

      - name: Test Application
        run: curl http://localhost:8080

      - name: Stop Docker Container
        if: always()
        run: docker stop node-app-container